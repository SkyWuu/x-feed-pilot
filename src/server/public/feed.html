<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X Feed Pilot · 阅读看板</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/feed.css">
</head>
<body>
  <a class="skip-link" href="#main-content">跳转到看板</a>
  <div class="shell">
    <aside class="sidebar" aria-label="看板导航">
      <div class="sidebar-head"><div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="-0.91 0.407 23.737 23.737"><path class="brand-check" d="M12.266 9.083L18.244 2.25L21.552 2.25L13.798 11.112ZM9.937 12.313L11.483 14.331L4.509 22.3L-0.91 17.559L0.73 15.684L4.274 18.785Z"/><path fill-rule="evenodd" d="M1.254 2.25L8.08 2.25L12.793 8.481L14.325 10.51L22.827 21.75L16.17 21.75L10.956 14.933L9.41 12.915ZM5.117 4.126L7.084 4.126L18.916 19.77L17.083 19.77Z"/></svg></span><div><strong>Feed Pilot</strong><small>LOCAL READING DECK</small></div></div><button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="收起侧栏" aria-expanded="true" title="收起侧栏">‹</button></div>
      <div class="sidebar-section">阅读看板</div>
      <nav class="deck-nav" aria-label="跳转到分类列">
        <button class="deck-link active" data-column="all" aria-current="true" title="全部记录"><span class="nav-icon all" aria-hidden="true">▥</span><span class="nav-label">全部记录</span><span class="nav-count" id="count-all">—</span></button>
        <button class="deck-link" data-column="selected" title="精选"><span class="nav-icon selected" aria-hidden="true">✦</span><span class="nav-label">精选</span><span class="nav-count" id="count-selected">—</span></button>
        <button class="deck-link" data-column="ignored" title="忽略"><span class="nav-icon ignored" aria-hidden="true">−</span><span class="nav-label">忽略</span><span class="nav-count" id="count-ignored">—</span></button>
        <button class="deck-link" data-column="insufficient" title="证据不足"><span class="nav-icon insufficient" aria-hidden="true">?</span><span class="nav-label">证据不足</span><span class="nav-count" id="count-insufficient">—</span></button>
      </nav>
      <div class="sidebar-foot"><span class="live-dot" aria-hidden="true"></span>仅保存在这台电脑<br><span>查看看板时训练暂停，返回 X 训练页后继续。</span></div>
    </aside>
    <main class="workspace" id="main-content">
      <header class="topbar">
        <div class="heading"><h1>推荐流观察记录</h1><p>最近会话 <span id="metric-session">—</span><span id="metric-reason"></span></p></div>
        <div class="toolbar"><label for="source">来源 <select id="source"><option value="">全部来源</option><option value="for_you">For You</option><option value="search">主动搜索</option></select></label><button id="refresh" class="refresh" type="button"><span aria-hidden="true">↻</span> 刷新</button></div>
      </header>
      <section class="deck" aria-label="分类时间线，可横向滚动" tabindex="0">
        <section class="column is-current" id="column-all" data-label="" aria-labelledby="title-all">
          <header class="column-head"><div><span class="column-mark all" aria-hidden="true"></span><h2 id="title-all">全部记录</h2><span class="column-count" id="column-count-all">—</span></div><p>每次曝光，按出现顺序</p></header>
          <div class="column-feed" id="feed-all" aria-live="polite"><div class="empty">正在读取本地记录…</div><div class="column-bottom" hidden><button class="more" data-label="all" type="button" hidden>加载更多</button></div></div>
        </section>
        <section class="column" id="column-selected" data-label="selected" aria-labelledby="title-selected">
          <header class="column-head"><div><span class="column-mark selected" aria-hidden="true"></span><h2 id="title-selected">精选</h2><span class="column-count" id="column-count-selected">—</span></div><p>值得回看的帖子</p></header>
          <div class="column-feed" id="feed-selected" aria-live="polite"><div class="empty">正在读取本地记录…</div><div class="column-bottom" hidden><button class="more" data-label="selected" type="button" hidden>加载更多</button></div></div>
        </section>
        <section class="column" id="column-ignored" data-label="ignored" aria-labelledby="title-ignored">
          <header class="column-head"><div><span class="column-mark ignored" aria-hidden="true"></span><h2 id="title-ignored">忽略</h2><span class="column-count" id="column-count-ignored">—</span></div><p>已看过，未进入精选</p></header>
          <div class="column-feed" id="feed-ignored" aria-live="polite"><div class="empty">正在读取本地记录…</div><div class="column-bottom" hidden><button class="more" data-label="ignored" type="button" hidden>加载更多</button></div></div>
        </section>
        <section class="column" id="column-insufficient" data-label="insufficient" aria-labelledby="title-insufficient">
          <header class="column-head"><div><span class="column-mark insufficient" aria-hidden="true"></span><h2 id="title-insufficient">证据不足</h2><span class="column-count" id="column-count-insufficient">—</span></div><p>需要更多上下文的帖子</p></header>
          <div class="column-feed" id="feed-insufficient" aria-live="polite"><div class="empty">正在读取本地记录…</div><div class="column-bottom" hidden><button class="more" data-label="insufficient" type="button" hidden>加载更多</button></div></div>
        </section>
      </section>
    </main>
  </div>
  <script src="/feed.js"></script>
  <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
</body>
</html>
